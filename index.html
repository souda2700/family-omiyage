<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家族のお土産購入リスト</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🎁 家族のお土産リスト</h1>
      <button id="config-btn" class="icon-btn" title="合言葉の変更">⚙️</button>
    </header>

    <!-- 入力エリア -->
    <section class="form-card">
      <form id="add-form">
        <!-- 誰が（購入者）を一番上に配置 -->
        <div class="form-group">
          <label for="buyer-select">誰が買う・入力者</label>
          <select id="buyer-select">
            <option value="共有">共有</option>
            <option value="父">父</option>
            <option value="母">母</option>
            <option value="子">子</option>
            <option value="__NEW__">＋ 新しく追加する...</option>
          </select>
          <input type="text" id="buyer-custom" class="mt-2 hidden" placeholder="名前を入力">
        </div>

        <div class="form-group">
          <label for="recipient-select">渡す相手</label>
          <select id="recipient-select">
            <option value="職場">職場</option>
            <option value="親戚">親戚</option>
            <option value="友人">友人</option>
            <option value="自分・家族">自分・家族</option>
            <option value="__NEW__">＋ 新しく追加する...</option>
          </select>
          <input type="text" id="recipient-custom" class="mt-2 hidden" placeholder="相手を入力（例: ○○さん）">
        </div>

        <div class="form-group">
          <label for="category-select">ジャンル</label>
          <select id="category-select">
            <option value="お菓子">お菓子</option>
            <option value="雑貨・キーホルダー">雑貨・キーホルダー</option>
            <option value="コスメ・理美容">コスメ・理美容</option>
            <option value="食品・調味料">食品・調味料</option>
            <option value="地酒・飲み物">地酒・飲み物</option>
            <option value="__NEW__">＋ 新しく追加する...</option>
          </select>
          <input type="text" id="category-custom" class="mt-2 hidden" placeholder="ジャンルを入力">
        </div>

        <div class="form-group">
          <label for="item-name-input">品物・メモ（空欄可）</label>
          <input type="text" id="item-name-input" placeholder="例: ○○煎餅 12個入り">
        </div>

        <button type="submit" class="primary-btn">リストに追加する</button>
      </form>
    </section>

    <!-- リスト表示エリア -->
    <section class="list-section">
      <div class="section-header">
        <h2>買い物リスト</h2>
        <button id="refresh-btn" class="refresh-btn">🔄 更新</button>
      </div>

      <div id="loading" class="loading-overlay hidden">
        <div class="spinner"></div>
      </div>

      <ul id="souvenir-list" class="souvenir-list">
        <!-- JSでここに動的生成されます -->
      </ul>
    </section>
  </div>

  <!-- 初回・合言葉設定用モーダル -->
  <div id="family-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h2>家族の合言葉を設定</h2>
      <p>家族で共有する合言葉（ID）を入力してください。同じ合言葉を入れるとデータを共有できます。</p>
      <input type="text" id="family-id-input" placeholder="例: tanaka2026">
      <button id="save-family-btn" class="primary-btn mt-2">設定してスタート</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
